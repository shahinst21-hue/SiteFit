# Local-only configuration prepared with Supabase CLI 2.119.0.
# This identifier names the Docker development stack, not a hosted project.
project_id = "sitefit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Application migrations and seeds begin in Phase 3.
[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

# Local platform services only; no application auth flows or storage buckets.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false

[storage]
enabled = true

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
