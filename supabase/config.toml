# Local-only configuration prepared with Supabase CLI 2.119.0.
# This identifier names the Docker development stack, not a hosted project.
project_id = "sitefit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Migration-managed application schema. No product seed data.
[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

# Development magic-link Auth. No social providers or application storage buckets.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/confirm",
  "http://127.0.0.1:3000/auth/callback",
  "https://sitefit-git-phase-3-database-auth-shahinst21-hues-projects.vercel.app/auth/confirm",
  "https://sitefit-git-phase-3-database-auth-shahinst21-hues-projects.vercel.app/auth/callback",
  "https://sitefit-git-phase-2-5-product-redesign-shahinst21-hues-projects.vercel.app/auth/confirm",
  "https://sitefit-git-phase-2-5-product-redesign-shahinst21-hues-projects.vercel.app/auth/callback",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 3600

# Hosted free-tier default email templates are immutable without custom SMTP.
# Use the default ConfirmationURL + PKCE callback. sign-in.html is an optional
# token-hash confirmation template for a later authorised custom SMTP setup.

[storage]
enabled = true

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
